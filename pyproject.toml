[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nightreader"
version = "0.1.0"
description = "An offline Linux PDF reader with night modes, editable bookmarks and text search"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "NightReader contributors"}]
dependencies = ["PyMuPDF==1.27.2", "numpy==2.5.2", "Pillow==12.3.0"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU Affero General Public License v3",
]

[project.urls]
Homepage = "https://github.com/zv201413/NightReader"
Issues = "https://github.com/zv201413/NightReader/issues"

[project.scripts]
nightreader = "nightread.cli:main"

[tool.setuptools.packages.find]
include = ["nightread*"]
